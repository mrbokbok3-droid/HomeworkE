function openChat(x,t){selected=x;selectedType=t;reply=null;markLocalUnread(t==="user"?chatId(me.uid,x.uid):x.id,0);$('app').classList.add("chat-open");$('chatAvatar').outerHTML=avatar(x,"chatAvatar");$('chatTitle').textContent=x.name||"Group";$('chatSub').textContent=t==="user"?(x.online&&x.showOnline!==false?"● Online":"Offline"):`${Object.keys(x.members||{}).length} members${x.admins?.[me.uid]?" · Admin":""}`;$('moreBtn').style.display=t==="user"||x.admins?.[me.uid]?"block":"none";listenMessages();listenTyping();renderList()}
function listenMessages(){if(messageOff)messageOff();const id=selectedType==="user"?chatId(me.uid,selected.uid):selected.id;$('messages').innerHTML='<div class="loading">Messages loading...</div>';messageOff=onValue(ref(db,"messages/"+id),s=>{const box=$('messages');box.innerHTML="";if(!s.exists()){box.innerHTML='<div class="empty">এখনও কোনো message নেই।</div>';return}const msgs=[];s.forEach(c=>msgs.push({key:c.key,...c.val()}));msgs.forEach(m=>renderMessage(m));box.scrollTop=box.scrollHeight;markSeenMessages(id,msgs);});}
function markSeenMessages(id,msgs){const updates={};msgs.forEach(m=>{if(m.senderId===me.uid)return;if(selectedType==="user"&&m.receiverId===me.uid&&!m.seen)updates[m.key+"/seen"]=true;if(selectedType==="group"&&!m.seenBy?.[me.uid])updates[m.key+"/seenBy/"+me.uid]=true});if(Object.keys(updates).length)update(ref(db,"messages/"+id),updates);markLocalUnread(id,0)}
function renderMessage(m){const mine=m.senderId===me.uid,e=document.createElement("div");e.className="bubble "+(mine?"mine":"theirs");let c="";if(m.replyText)c+=`<div class="reply-preview">${esc(m.replyText)}</div>`;if(m.type==="image")c+=`<img class="msg-img" src="${esc(m.url)}" alt="image">`;else c+=esc(m.text||"");const status=mine?(selectedType==="user"?(m.seen?" ✓✓":" ✓"):(m.seenBy&&Object.keys(m.seenBy).length?" ✓✓":" ✓")):"";e.innerHTML=c+`<div class="msg-actions"><button data-reply>↩</button>${mine?'<button data-delete>🗑</button>':''}</div><span class="meta">${new Date(m.createdAt||Date.now()).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}${status}</span>`;e.querySelector("[data-reply]").onclick=()=>setReply(m);e.querySelector("[data-delete]")?.addEventListener("click",()=>deleteMessage(m.key));$('messages').appendChild(e)}
function setReply(m){reply=m;$('replyText').textContent="Reply: "+(m.text||"Image message");$('replyBar').classList.remove("hidden");$('message').focus()};$('cancelReply').onclick=()=>{reply=null;$('replyBar').classList.add("hidden")};
async function deleteMessage(id){if(!selected||!confirm("এই message delete করতে চান?"))return;try{const path="messages/"+(selectedType==="user"?chatId(me.uid,selected.uid):selected.id)+"/"+id;await remove(ref(db,path));toast("Message deleted")}catch(e){toast("Message delete করা যায়নি")}}
async function sendMessage(m){if(!selected||!me)return;const id=selectedType==="user"?chatId(me.uid,selected.uid):selected.id;const n=push(ref(db,"messages/"+id));const data={id:n.key,...m,senderId:me.uid,receiverId:selectedType==="user"?selected.uid:null,createdAt:Date.now(),seen:false,seenBy:selectedType==="group"?{[me.uid]:true}:undefined,replyText:reply?.text||""};await set(n,data);reply=null;$('replyBar').classList.add("hidden")}
$('composer').onsubmit=async e=>{e.preventDefault();const text=$('message').value.trim();if(!text||!selected)return;try{await sendMessage({type:"text",text});$('message').value=""}catch(e){toast("Message send করা যায়নি")}};
const emojis=["😀","😂","😍","🥰","😎","👍","❤️","🔥","🎉","🙏","👏","😢","😮","😡","🤣","😊","😉","😘","🤝","💯","✨","🥳","😇","🤔","🙌","👌","❤️‍🔥","😂"];$('emojiPanel').innerHTML=emojis.map(x=>`<button type="button">${x}</button>`).join("");$('emojiPanel').querySelectorAll("button").forEach(b=>b.onclick=()=>{$('message').value+=b.textContent;$('emojiPanel').classList.add("hidden");$('message').focus()});$('emojiBtn').onclick=()=>$('emojiPanel').classList.toggle("hidden");
$('imageBtn').onclick=()=>$('imageFile').click();$('imageFile').onchange=async()=>{const f=$('imageFile').files[0];if(!f||!selected)return;if(f.size>5*1024*1024){toast("Image সর্বোচ্চ 5MB হতে হবে");return}try{const r=sRef(storage,`chatImages/${me.uid}/${Date.now()}_${f.name.replace(/[^\w.-]/g,"_")}`);await uploadBytes(r,f);await sendMessage({type:"image",url:await getDownloadURL(r)})}catch(e){toast("Image upload ব্যর্থ হয়েছে")}$('imageFile').value=""};
function listenTyping(){if(typingOff)typingOff();if(!selected)return;const id=selectedType==="user"?chatId(me.uid,selected.uid):selected.id;typingOff=onValue(ref(db,"typing/"+id),s=>{let active=false;s.forEach(c=>{if(c.key!==me.uid&&c.val()===true)active=true});$('typing').textContent=active?"typing...":""})}$('message').oninput=()=>{if(!selected)return;const id=selectedType==="user"?chatId(me.uid,selected.uid):selected.id;set(ref(db,`typing/${id}/${me.uid}`),true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>set(ref(db,`typing/${id}/${me.uid}`),false),900)};
function playSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.08,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.12);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.13)}catch(e){}}
function notify(title,body,id){if(!muted[id])playSound();if(document.hidden&&"Notification" in window&&Notification.permission==="granted"&&!muted[id])new Notification(title,{body})}
async function requestNotifications(){if("Notification" in window&&Notification.permission==="default")try{await Notification.requestPermission()}catch(e){}}
function listenIncoming(){onValue(ref(db,"messages"),snap=>{const currentId=selected?(selectedType==="user"?chatId(me.uid,selected.uid):selected.id):null;snap.forEach(chatSnap=>{const id=chatSnap.key;let latest=null,count=0;chatSnap.forEach(ms=>{const m=ms.val();if(m.senderId===me.uid)return;if(selectedType&&id===currentId)return;const unseen=selectedType==="group"?!(m.seenBy&&m.seenBy[me.uid]):m.receiverId===me.uid&&!m.seen;if(unseen)count++;if(!latest||Number(m.createdAt||0)>Number(latest.createdAt||0))latest=m});if(count){markLocalUnread(id,count);if(latest){const name=users.find(u=>u.uid===latest.senderId)?.name||"New message";notify(name,latest.type==="image"?"📷 Image message":latest.text||"New message",id)}}})});requestNotifications()}
$('muteBtn').onclick=()=>{if(!selected)return;const id=selectedType==="user"?chatId(me.uid,selected.uid):selected.id;muted[id]=!muted[id];localStorage.setItem("chatMuted",JSON.stringify(muted));$('muteBtn').textContent=muted[id]?"🔕":"🔔";toast(muted[id]?"Notification muted":"Notification unmuted")};
$('back').onclick=()=>{$('app').classList.remove("chat-open");selected=null;if(messageOff)messageOff();if(typingOff)typingOff()};
function openModal(title,body,saveLabel="Save",onSave=null,showSave=true){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalSave').textContent=saveLabel;$('modalSave').style.display=showSave?"block":"none";$('modal').classList.remove("hidden");$('modalSave').onclick=async()=>{try{await onSave?.()}catch(e){toast("Operation failed")}}}function closeModal(){$('modal').classList.add("hidden")}$('modalCancel').onclick=closeModal;
$('profileBtn').onclick=()=>openModal("Profile",`<input id="profileName" class="field" value="${esc(profile?.name||"")}" placeholder="Display Name"><input id="profilePhoto" class="field" value="${esc(profile?.photo||"")}" placeholder="Profile Photo URL"><label><input id="showOnline" type="checkbox" ${profile?.showOnline!==false?'checked':''}> Online status দেখাবেন</label>`,"Save",async()=>{const p={name:$('profileName').value.trim()||"User",photo:$('profilePhoto').value.trim(),showOnline:$('showOnline').checked};profile={...profile,...p};localStorage.setItem("chatProfile",JSON.stringify(profile));await update(ref(db,"users/"+me.uid),p);closeModal();renderList();toast("Profile updated")});
$('createGroupBtn').onclick=()=>openGroupEditor();
async function openGroupEditor(group=null){const memberIds=Object.keys(group?.members||{});openModal(group?"Edit Group":"Create Group",`<input id="groupName" class="field" value="${esc(group?.name||"")}" placeholder="Group Name"><input id="groupPhoto" class="field" value="${esc(group?.photo||"")}" placeholder="Group Photo URL"><div style="font-weight:800;margin:8px 0">Members</div><div id="memberPicker"></div>`,group?"Save":"Create",async()=>{const name=$('groupName').value.trim();if(name.length<2){toast("Group name দিন");return}const members={};document.querySelectorAll('#memberPicker input:checked').forEach(x=>members[x.value]=true);members[me.uid]=true;try{if(group){await update(ref(db,"groups/"+group.id),{name,photo:$('groupPhoto').value.trim(),members});toast("Group updated")}else{const n=push(ref(db,"groups"));await set(n,{id:n.key,name,photo:$('groupPhoto').value.trim(),members,admins:{[me.uid]:true},createdBy:me.uid,createdAt:Date.now()});toast("Group created")}closeModal()}catch(e){toast("Group save করা যায়নি")}});const picker=$('memberPicker');picker.innerHTML=users.map(u=>`<label class="group-member">${avatar(u,"",true)}<span>${esc(u.name)}</span><input class="member-check" type="checkbox" value="${u.uid}" ${memberIds.includes(u.uid)?"checked":""}></label>`).join("")||'<div class="empty">No users available</div>'}
$('moreBtn').onclick=()=>{if(!selected)return;if(selectedType==="user")openPrivacy();else if(selected.admins?.[me.uid])openGroupManage(selected)};
function openPrivacy(){const blocked=!!selected.blockedFor?.[me.uid];openModal("Privacy",`<button id="blockToggle" class="${blocked?'success':'danger'}" style="width:100%;border:0;border-radius:10px;padding:12px;color:#fff">${blocked?'Unblock User':'Block User'}</button><button id="reportUser" class="secondary" style="width:100%;border:0;border-radius:10px;padding:12px;margin-top:8px">Report User</button>`,"Close",async()=>{},false);$('blockToggle').onclick=async()=>{const path=`users/${selected.uid}/blockedFor/${me.uid}`;if(blocked)await remove(ref(db,path));else await set(ref(db,path),true);closeModal();toast(blocked?"User unblocked":"User blocked")};$('reportUser').onclick=async()=>{await push(ref(db,"reports"),{type:"user",reporterId:me.uid,reportedUserId:selected.uid,createdAt:Date.now()});closeModal();toast("Report submitted")}}
async function openGroupManage(g){openModal("Group Management",`<input id="editGroupName" class="field" value="${esc(g.name||"")}" placeholder="Group Name"><input id="editGroupPhoto" class="field" value="${esc(g.photo||"")}" placeholder="Group Photo URL"><div style="font-weight:800;margin:8px 0">Members</div><div id="manageMembers"></div>`,"Save",async()=>{await update(ref(db,"groups/"+g.id),{name:$('editGroupName').value.trim()||g.name,photo:$('editGroupPhoto').value.trim()});closeModal();toast("Group updated")});const box=$('manageMembers');box.innerHTML=Object.keys(g.members||{}).map(uid=>{const u=users.find(x=>x.uid===uid)||({uid,name:uid});const admin=!!g.admins?.[uid];return`<div class="group-member">${avatar(u,"",true)}<span style="flex:1">${esc(u.name)} ${admin?'👑':''}</span>${uid!==me.uid?`<button class="admin-btn danger" data-remove="${uid}" style="padding:6px 8px">Remove</button>`:""}</div>`}).join("");box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm("Member remove করতে চান?"))return;await update(ref(db,"groups/"+g.id+"/members"),{[b.dataset.remove]:null});closeModal();toast("Member removed")})}
window.addEventListener("beforeunload",()=>{if(me)update(ref(db,"users/"+me.uid),{online:false,lastSeen:Date.now()})});
// ADMIN
$('adminLoginOpen').onclick=()=>{$('adminLoginErr').textContent="";$('adminCode').value="";$('adminLoginModal').classList.remove("hidden");setTimeout(()=>$('adminCode').focus(),50)};
$('adminLoginCancel').onclick=()=>$('adminLoginModal').classList.add("hidden");
$('adminLoginBtn').onclick=adminLogin;
$('adminCode').oninput=()=>{$('adminCode').value=$('adminCode').value.replace(/\D/g,"").slice(0,6)};
$('adminCode').onkeydown=e=>{if(e.key==="Enter")adminLogin()};
function adminLogin(){
  const code=$('adminCode').value.trim();
  if(code.length!==6){$('adminLoginErr').textContent="Admin Code অবশ্যই ৬ digit হতে হবে।";return}
  $('adminLoginBtn').disabled=true;
  try{
    if(code!==ADMIN_ACCESS_CODE)throw Error("invalid-admin-code");
    $('adminLoginModal').classList.add("hidden");
    showAdminPanel()
  }catch(e){
    $('adminLoginErr').textContent="Admin Access Code সঠিক নয়।"
  }finally{$('adminLoginBtn').disabled=false}
}
function showAdminPanel(){$('lock').classList.add("hidden");$('app').classList.add("hidden");$('adminPanel').classList.remove("hidden");adminLoadDashboard()}
function adminCard(t,v,i){return`<div class="admin-card"><div style="font-size:25px">${i}</div><div class="admin-card-label">${t}</div><div class="admin-card-value">${v}</div></div>`}
async function adminLoadDashboard(){$('adminPageTitle').textContent="Dashboard";$('adminContent').innerHTML='<div class="admin-box">Loading...</div>';try{const [u,g,m]=await Promise.all([get(ref(db,"users")),get(ref(db,"groups")),get(ref(db,"messages"))]);let uc=0,on=0,gc=0,mc=0;u.forEach(x=>{uc++;if(x.val()?.online)on++});g.forEach(()=>gc++);m.forEach(x=>x.forEach(()=>mc++));$('adminContent').innerHTML=`<div class="admin-cards">${adminCard("Total Users",uc,"👥")}${adminCard("Online Users",on,"🟢")}${adminCard("Total Messages",mc,"💬")}${adminCard("Total Groups",gc,"👨‍👩‍👧‍👦")}</div><div class="admin-box" style="margin-top:20px"><h3 style="margin-top:0">System</h3><div style="color:#16a34a;font-weight:800">● Admin Code Verified</div><p style="color:#6b7280">Chat data is stored in Firebase Realtime Database/Storage configured for this app.</p></div>`}catch(e){$('adminContent').innerHTML='<div class="admin-box" style="color:#991b1b">Dashboard data load failed. Firebase Rules পরীক্ষা করুন।</div>'}}
async function adminLoadUsers(){$('adminPageTitle').textContent="Users";$('adminContent').innerHTML='<div class="admin-box">Loading...</div>';try{const s=await get(ref(db,"users")),arr=[];s.forEach(c=>arr.push({...c.val(),uid:c.key}));$('adminContent').innerHTML='<div class="admin-box"><input id="adminUserSearch" class="admin-search" placeholder="Search User..."><div id="adminUserList" style="margin-top:12px"></div></div>';const render=()=>{const q=$('adminUserSearch').value.toLowerCase().trim(),list=arr.filter(u=>(u.name||"").toLowerCase().includes(q)||(u.uid||"").toLowerCase().includes(q));$('adminUserList').innerHTML=list.length?list.map(u=>`<div class="admin-user"><div class="avatar sm">${esc(initials(u.name))}</div><div class="admin-user-main"><b>${esc(u.name||"User")}</b><div class="admin-user-meta">${u.online?'Online':'Offline'} · ${esc(u.uid)} · ${u.adminBlocked?'Blocked':''}</div></div><button class="admin-btn" data-view="${u.uid}">View</button><button class="admin-btn ${u.adminBlocked?'admin-unblock':'admin-block'}" data-block="${u.uid}">${u.adminBlocked?'Unblock':'Block'}</button><button class="admin-btn admin-delete" data-delete="${u.uid}">Delete</button></div>`).join(""):'<div class="empty">No users found</div>';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const u=arr.find(x=>x.uid===b.dataset.view);openModal("User",`<p><b>Name:</b> ${esc(u.name)}</p><p><b>UID:</b> ${esc(u.uid)}</p><p><b>Status:</b> ${u.online?'Online':'Offline'}</p><p><b>Blocked:</b> ${u.adminBlocked?'Yes':'No'}</p>`,"Close",null,false)});document.querySelectorAll('[data-block]').forEach(b=>b.onclick=async()=>{const u=arr.find(x=>x.uid===b.dataset.block);if(!confirm(`${u.adminBlocked?'Unblock':'Block'} this user?`))return;await update(ref(db,"users/"+u.uid),{adminBlocked:!u.adminBlocked});adminLoadUsers()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm("এই user profile delete করতে চান?"))return;await update(ref(db,"users/"+b.dataset.delete),{adminDeleted:true,online:false});adminLoadUsers()})};$('adminUserSearch').oninput=render;render()}catch(e){$('adminContent').innerHTML='<div class="admin-box">Users load failed.</div>'}}
async function adminLoadSecurity(){$('adminPageTitle').textContent="Security PIN";$('adminContent').innerHTML=`<div class="admin-box" style="max-width:560px"><h3 style="margin-top:0">Security PIN Management</h3><p style="color:#6b7280">নতুন PIN ৬ digit হতে হবে। পরিবর্তনের পর পুরোনো PIN valid থাকবে না।</p><input id="newPin" class="admin-input" inputmode="numeric" maxlength="6" type="password" placeholder="New 6-Digit PIN"><input id="confirmPin" class="admin-input" inputmode="numeric" maxlength="6" type="password" placeholder="Confirm New PIN"><div id="pinChangeMsg" class="admin-msg"></div><button id="changePinBtn" class="primary">Change PIN</button></div>`;[$('newPin'),$('confirmPin')].forEach(x=>x.oninput=()=>x.value=x.value.replace(/\D/g,"").slice(0,6));$('changePinBtn').onclick=adminChangePin}
async function adminChangePin(){const a=$('newPin').value,b=$('confirmPin').value,msg=$('pinChangeMsg');if(a.length!==6){msg.style.color="#dc2626";msg.textContent="PIN অবশ্যই ৬ digit হতে হবে।";return}if(a!==b){msg.style.color="#dc2626";msg.textContent="PIN মিলছে না।";return}const btn=$('changePinBtn');btn.disabled=true;btn.textContent="Saving...";try{const r=await changeSecurityCode({code:a});if(r?.data?.success!==true&&r?.data?.valid!==true)throw Error("failed");msg.style.color="#16a34a";msg.textContent="Security PIN সফলভাবে পরিবর্তন হয়েছে। পুরোনো PIN আর valid নয়।";$('newPin').value="";$('confirmPin').value=""}catch(e){msg.style.color="#dc2626";msg.textContent=e?.code==="functions/not-found"?"PIN management service পাওয়া যায়নি।":"PIN পরিবর্তন করা যায়নি। Admin permission পরীক্ষা করুন।"}finally{btn.disabled=false;btn.textContent="Change PIN"}}
function adminLogout(){$('adminPanel').classList.add("hidden");$('securityPin').value="";$('lock').classList.remove("hidden");setTimeout(()=>$('securityPin').focus(),50)}
document.querySelectorAll('.admin-nav[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.admin-nav[data-page]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.page==='dashboard')adminLoadDashboard();if(b.dataset.page==='users')adminLoadUsers();if(b.dataset.page==='security')adminLoadSecurity()});$('adminRefresh').onclick=()=>{const p=document.querySelector('.admin-nav.active')?.dataset.page||'dashboard';p==='dashboard'?adminLoadDashboard():p==='users'?adminLoadUsers():adminLoadSecurity()};$('adminLogout').onclick=adminLogout;
if(sessionStorage.getItem("pinVerified")==="1"){$('lock').classList.add("hidden");$('app').classList.remove("hidden");startApp()}else setTimeout(()=>$('securityPin').focus(),50);
</script>
