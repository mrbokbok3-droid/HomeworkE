function escapeHTML(value){
 return String(value??"")
  .replace(/[&<>"']/g,m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m]));
}

function initials(name){
 return (name||"?")
  .trim()
  .charAt(0)
  .toUpperCase();
}

function chatId(a,b){
 return [a,b].sort().join("_");
}

function toast(text){
 const t=$("toast");
 if(!t)return;
 t.textContent=text;
 t.style.display="block";
 clearTimeout(window.__toastTimer);
 window.__toastTimer=setTimeout(()=>{
  t.style.display="none";
 },2200);
}

async function unlock(){
 const code=$("securityCode")
  .value
  .replace(/\D/g,"");

 $("lockErr").textContent="";

 if(code.length!==6){
  $("lockErr").textContent=
   "৬ সংখ্যার Security Code দিন।";
  return;
 }

 const button=$("unlock");
 button.disabled=true;
 button.textContent="যাচাই হচ্ছে...";

 try{
  const result=await verifySecurityCode({code});

  if(result.data?.valid===true){
   $("lock").classList.add("hidden");
   $("usernameEntry").classList.remove("hidden");
   $("securityCode").value="";
  }else{
   $("lockErr").textContent=
    "Security Code সঠিক নয়।";
  }
 }catch(error){
  console.error(error);
  $("lockErr").textContent=
   error?.message||
   "Security Code verification ব্যর্থ হয়েছে।";
 }finally{
  button.disabled=false;
  button.textContent="প্রবেশ করুন";
 }
}

function listenUsers(){
 if(usersOff)usersOff();

 usersOff=onValue(
  ref(db,"users"),
  snapshot=>{
   users=[];

   snapshot.forEach(child=>{
    const user=child.val();

    if(
     user&&
     user.uid&&
     user.uid!==me?.uid&&
     !user.deleted
    ){
     users.push(user);
    }
   });

   users.sort((a,b)=>
    (a.name||"").localeCompare(
     b.name||"",
     "bn"
    )
   );

   renderList();

   if(selectedType==="user"&&selected){
    const updated=users.find(
     x=>x.uid===selected.uid
    );

    if(updated){
     selected={
      ...selected,
      ...updated
     };
     updateChatHeader();
    }
   }
  }
 );
}

function listenGroups(){
 if(groupsOff)groupsOff();

 groupsOff=onValue(
  ref(db,"groups"),
  snapshot=>{
   groups=[];

   snapshot.forEach(child=>{
    const g=child.val();

    if(
     g&&
     g.members&&
     g.members[me?.uid]&&
     !g.deleted
    ){
     groups.push({
      ...g,
      id:child.key
     });
    }
   });

   renderList();
  }
 );
}

   ?users
   :groups;

   .toLowerCase()
   .includes(q)
 );

 filtered.forEach(item=>{
  const el=document.createElement("div");
  el.className="item";

  const id=
   activeTab==="users"
    ?chatId(me.uid,item.uid)
    :item.id;

  const unreadCount=
   Number(unread[id]||0);

  const status=
   activeTab==="users"
    ?(

      item.showOnline!==false
       ?"● Online"
       :"Offline"
     )
    :`${Object.keys(item.members||{}).length} members`;

   ${avatarHTML(item)}

     ${escapeHTML(status)}

   ${
    unreadCount>0

  el.addEventListener("click",()=>{

 });

 }
}

 }catch(error){

}

function listenMessages(){

  snapshot=>{

function renderMessage(id,message){
 const mine=message.senderId===me.uid;

 const wrap=document.createElement("div");
 wrap.className=
  "message-wrap "+
  (mine?"mine":"theirs");

 const bubble=document.createElement("div");
 bubble.className=
  "bubble "+
  (mine?"mine":"theirs");

 let content="";

 if(message.replyText){
  content+=`
   <div class="reply">
    ${escapeHTML(message.replyText)}
   </div>
  `;
 }

 if(message.deleted){
  content+=`
   <div class="msg-deleted">
    This message was deleted
   </div>
  `;
 }else if(message.type==="image"){
  content+=`
   <img
    class="msg-img"
    src="${escapeHTML(message.url||"")}"
    alt="image"
   >
  `;
 }else{
  content+=escapeHTML(message.text||"");
 }

 const status=mine
  ?(message.seen?" ✓✓":" ✓")
  :"";

 content+=`
  <span class="meta">
   ${new Date(
    message.createdAt||Date.now()
   ).toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
   })}
   ${status}
  </span>
 `;

 bubble.innerHTML=content;

 bubble.addEventListener(
  "contextmenu",
  e=>{
   e.preventDefault();
   messageMenu(
    id,
    message,
    mine
   );
  }
 );

 wrap.appendChild(bubble);
 $("messages").appendChild(wrap);
}

$("composer")?.addEventListener(
 "submit",
 async e=>{
  e.preventDefault();

  const text=$("message")
   .value
   .trim();

  if(!selected||!text)return;

  if(selectedType==="user"){
   if(await isBlocked(selected.uid)){
    toast("আপনি এই user-কে block করেছেন।");
    return;
   }

   if(await isBlockedByUser(selected.uid)){
    toast("এই user আপনাকে block করেছে।");
    return;
   }
  }

  try{
   await sendMessage({
    type:"text",
    text
   });

   $("message").value="";
   stopTyping();
  }catch(error){
   console.error(error);
   toast(
    "Message পাঠানো যায়নি: "+
    (error?.message||"unknown error")
   );
  }
 }
);

async function sendMessage(message){
 if(!me||!selected){
  throw new Error("Chat নির্বাচন করুন।");
 }

 const id=
  selectedType==="user"
   ?chatId(me.uid,selected.uid)
   :selected.id;

 const messageRef=push(
  ref(db,"messages/"+id)
 );

 const data={
  id:messageRef.key,
  ...message,
  senderId:me.uid,
  receiverId:
   selectedType==="user"
    ?selected.uid
    :null,
  groupId:
   selectedType==="group"
    ?selected.id
    :null,
  createdAt:Date.now(),
  delivered:false,
  seen:false,
  replyText:
   currentReply?.text||""
 };

 await set(messageRef,data);

 currentReply=null;
 clearReply();
}

async function markSeen(id){
 try{
  const snapshot=await get(
   ref(db,"messages/"+id)
  );

  if(!snapshot.exists())return;

  const updates={};

  snapshot.forEach(child=>{
   const message=child.val();

   if(
    message.receiverId===me.uid&&
    !message.seen
   ){
    updates[
     child.key+"/seen"
    ]=true;
   }
  });

  if(Object.keys(updates).length){
   await update(
    ref(db,"messages/"+id),
    updates
   );
  }
 }catch(error){
  console.error(error);
 }
}

$("imageFile")?.addEventListener(
 "change",
 async()=>{
  const file=$("imageFile").files[0];

  if(!file||!selected)return;

  if(file.size>5*1024*1024){
   toast("Image 5MB-এর মধ্যে রাখুন।");
   $("imageFile").value="";
   return;
  }

  if(!file.type.startsWith("image/")){
   toast("শুধু image file ব্যবহার করুন।");
   $("imageFile").value="";
   return;
  }

  try{
   const safeName=file.name.replace(
    /[^\w.-]/g,
    "_"
   );

   const path=
    `chatImages/${me.uid}/${Date.now()}_${safeName}`;

   const fileRef=storageRef(
    storage,
    path
   );

   toast("Image upload হচ্ছে...");

   await uploadBytes(
    fileRef,
    file
   );

   const url=await getDownloadURL(
    fileRef
   );

   await sendMessage({
    type:"image",
    url
   });

   toast("Image sent");
  }catch(error){
   console.error(error);
   toast(
    "Image upload ব্যর্থ: "+
    (error?.message||"unknown")
   );
  }

  $("imageFile").value="";
 }
);

function typingPath(){
 if(!selected)return null;

 const id=
  selectedType==="user"
   ?chatId(me.uid,selected.uid)
   :selected.id;

 return `typing/${id}/${me.uid}`;
}

async function setTyping(value){
 const path=typingPath();
 if(!path)return;

 try{
  await set(
   ref(db,path),
   value
  );
 }catch(error){
  console.error(error);
 }
}

async function stopTyping(){
 clearTimeout(typingTimer);

 const path=typingPath();
 if(!path)return;

 try{
  await remove(ref(db,path));
 }catch(error){
  console.error(error);
 }
}

  }
 );
}

   const email=
    $("adminEmail")?.value.trim()||"";

   const password=
    $("adminPassword")?.value||"";

   const errorBox=
    $("adminLoginError");

   if(!password){
    if(errorBox)
     errorBox.textContent=

    $("adminPassword")?.focus();
    return;
   }

   saveButton.disabled=true;
   saveButton.textContent=
    "Login হচ্ছে...";

   try{
    const result=
     await signInWithEmailAndPassword(
      auth,
      email,
      password
     );

    if(result.user.uid!==ADMIN_UID){
     await signOut(auth);

     if(errorBox)
      errorBox.textContent=
       "Login হয়েছে, কিন্তু এই account-এর Admin permission নেই.";

    $("usernameEntry")?.classList.add("hidden");
    $("app")?.classList.add("hidden");
    $("adminPanel")?.classList.remove("hidden");

     error

     errorBox.textContent=

    saveButton.disabled=false;
    saveButton.textContent="Login";
   }
  };

  $("adminEmail")?.addEventListener(
   "keydown",
   e=>{
    if(e.key==="Enter")
     $("adminPassword")?.focus();

  );

  $("adminPassword")?.addEventListener(

     saveButton.click();
   }
  );

  try{
   await signOut(auth);
  }catch(error){
   console.error(error);
  }

  isAdmin=false;

  if(adminUsersOff){
   adminUsersOff();
   adminUsersOff=null;
  }

  if(adminGroupsOff){
   adminGroupsOff();
   adminGroupsOff=null;
  }

  if(adminReportsOff){
   adminReportsOff();
   adminReportsOff=null;
  }

  $("adminPanel")
   .classList.add("hidden");

  $("app")
   .classList.add("hidden");

  $("usernameEntry")
   .classList.add("hidden");

  $("lock")
   .classList.remove("hidden");

  $("securityCode").value="";
});

window.addEventListener(
 "online",
 async()=>{
  if(me){
   try{
    await update(
     ref(db,"users/"+me.uid),
     {
      online:true,
      lastSeen:Date.now()
     }
    );
   }catch(error){}
  }
 }
);

window.addEventListener(
 "offline",
 async()=>{
  if(me){
   try{
    await update(
     ref(db,"users/"+me.uid),
     {
      online:false,
      lastSeen:Date.now()
     }
    );
   }catch(error){}
  }
 }
);

function refreshMuteIcon(){
 if(!selected)return;

 const id=
  selectedType==="user"
   ?chatId(
    me.uid,
    selected.uid
   )
   :selected.id;

 $("muteBtn").textContent=
  muted[id]?"🔕":"🔔";
}

setInterval(()=>{
 if(selected){
  refreshMuteIcon();
  updateChatHeader();
 }
},3000);

$("securityCode")?.focus();
</script>
