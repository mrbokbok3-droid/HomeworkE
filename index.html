<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atik Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #111;
      height: 100vh;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      height: 100vh;
      display: flex;
      background: #fff;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      width: 340px;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .sidebar-header {
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
    }

    .logout-btn {
      border: none;
      background: #f1f1f1;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .search-box {
      padding: 12px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 15px;
      border: none;
      outline: none;
      background: #f1f3f5;
      border-radius: 22px;
    }

    .user-list {
      flex: 1;
      overflow-y: auto;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      cursor: pointer;
    }

    .user-item:hover {
      background: #f5f5f5;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1877f2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .user-info {
      min-width: 0;
    }

    .user-name {
      font-weight: 600;
    }

    .user-status {
      font-size: 12px;
      color: #777;
      margin-top: 3px;
    }

    .online {
      color: #18a558;
    }

    /* ================= CHAT ================= */

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      height: 70px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
    }

    .chat-user-name {
      font-weight: 700;
    }

    .chat-user-status {
      font-size: 12px;
      color: #777;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f7f8fa;
    }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 18px;
      word-break: break-word;
      position: relative;
    }

    .message.me {
      align-self: flex-end;
      background: #1877f2;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .message.other {
      align-self: flex-start;
      background: #e4e6eb;
      color: #111;
      border-bottom-left-radius: 5px;
    }

    .message-time {
      display: block;
      font-size: 10px;
      opacity: .7;
      margin-top: 4px;
      text-align: right;
    }

    .typing {
      min-height: 22px;
      padding: 0 20px;
      font-size: 12px;
      color: #777;
    }

    .message-form {
      padding: 12px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 8px;
      background: white;
    }

    .message-form input {
      flex: 1;
      border: none;
      outline: none;
      background: #f1f3f5;
      border-radius: 22px;
      padding: 12px 16px;
    }

    .send-btn {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #1877f2;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    /* ================= LOGIN ================= */

    .auth-screen {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .auth-card h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .auth-card p {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .auth-card input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;
    }

    .auth-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #1877f2;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .switch-auth {
      margin-top: 15px;
      text-align: center;
      color: #1877f2;
      cursor: pointer;
      font-size: 14px;
    }

    .error {
      color: #d93025;
      font-size: 13px;
      margin-bottom: 10px;
      text-align: center;
    }

    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      text-align: center;
      padding: 30px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {

      .sidebar {
        width: 100%;
      }

      .chat-area {
        display: none;
      }

      .app.chat-open .sidebar {
        display: none;
      }

      .app.chat-open .chat-area {
        display: flex;
      }

      .mobile-back {
        display: block !important;
      }

      .message {
        max-width: 82%;
      }
    }

    .mobile-back {
      display: none;
      border: none;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authScreen" class="auth-screen">

  <div class="auth-card">

    <h1>Atik Chat</h1>
    <p id="authSubtitle">Create your account</p>

    <div id="authError" class="error"></div>

    <input id="nameInput"
           type="text"
           placeholder="Your name">

    <input id="emailInput"
           type="email"
           placeholder="Email">

    <input id="passwordInput"
           type="password"
           placeholder="Password">

    <button id="authBtn" class="auth-btn">
      Create Account
    </button>

    <div id="switchAuth" class="switch-auth">
      Already have an account? Login
    </div>

  </div>

</div>


<!-- ================= CHAT APP ================= -->

<div id="chatApp" class="app" style="display:none;">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="logo">Atik Chat</div>

      <button id="logoutBtn" class="logout-btn">
        Logout
      </button>
    </div>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="Search users..."
      >
    </div>

    <div id="userList" class="user-list"></div>

  </aside>


  <!-- CHAT -->

  <main class="chat-area">

    <div class="chat-header">

      <button id="backBtn" class="mobile-back">
        ←
      </button>

      <div id="chatAvatar" class="avatar">
        ?
      </div>

      <div>
        <div id="chatUserName" class="chat-user-name">
          Select a user
        </div>

        <div id="chatUserStatus" class="chat-user-status">
          Start a conversation
        </div>
      </div>

    </div>

    <div id="messages" class="messages">

      <div class="empty">
        Select a user to start chatting
      </div>

    </div>

    <div id="typingIndicator" class="typing"></div>

    <form id="messageForm" class="message-form">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button class="send-btn" type="submit">
        ➤
      </button>

    </form>

  </main>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getDatabase,
    ref,
    set,
    push,
    get,
    onValue,
    update,
    onDisconnect,
    query,
    orderByChild
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  import {
    getStorage
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


  /* ================= FIREBASE CONFIG ================= */

  const firebaseConfig = {

    apiKey: "AIzaSyCdU1xvH8YN24e7FxHM8cno2OOkC5AsF6U",

    authDomain: "webtexsite.firebaseapp.com",

    databaseURL:
      "https://webtexsite-default-rtdb.firebaseio.com",

    projectId: "webtexsite",

    storageBucket:
      "webtexsite.firebasestorage.app",

    messagingSenderId:
      "999767910404",

    appId:
      "1:999767910404:web:1cf1f40328d46c2714ad51",

    measurementId:
      "G-HCQ75RZE6Z"
  };


  /* ================= INITIALIZE ================= */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getDatabase(app);

  const storage = getStorage(app);


  /* ================= ELEMENTS ================= */

  const authScreen =
    document.getElementById("authScreen");

  const chatApp =
    document.getElementById("chatApp");

  const authBtn =
    document.getElementById("authBtn");

  const switchAuth =
    document.getElementById("switchAuth");

  const authSubtitle =
    document.getElementById("authSubtitle");

  const authError =
    document.getElementById("authError");

  const nameInput =
    document.getElementById("nameInput");

  const emailInput =
    document.getElementById("emailInput");

  const passwordInput =
    document.getElementById("passwordInput");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const userList =
    document.getElementById("userList");

  const searchInput =
    document.getElementById("searchInput");

  const messages =
    document.getElementById("messages");

  const messageForm =
    document.getElementById("messageForm");

  const messageInput =
    document.getElementById("messageInput");

  const chatUserName =
    document.getElementById("chatUserName");

  const chatUserStatus =
    document.getElementById("chatUserStatus");

  const chatAvatar =
    document.getElementById("chatAvatar");

  const typingIndicator =
    document.getElementById("typingIndicator");

  const backBtn =
    document.getElementById("backBtn");


  /* ================= STATE ================= */

  let registerMode = true;

  let currentUser = null;

  let selectedUser = null;

  let selectedConversation = null;

  let usersCache = [];

  let messageListener = null;


  /* ================= AUTH MODE ================= */

  switchAuth.addEventListener("click", () => {

    registerMode = !registerMode;

    authError.textContent = "";

    if (registerMode) {

      authSubtitle.textContent =
        "Create your account";

      authBtn.textContent =
        "Create Account";

      switchAuth.textContent =
        "Already have an account? Login";

      nameInput.style.display =
        "block";

    } else {

      authSubtitle.textContent =
        "Login to your account";

      authBtn.textContent =
        "Login";

      switchAuth.textContent =
        "Don't have an account? Create one";

      nameInput.style.display =
        "none";
    }

  });


  /* ================= AUTH ================= */

  authBtn.addEventListener("click", async () => {

    authError.textContent = "";

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    const name =
      nameInput.value.trim();

    if (!email || !password) {

      authError.textContent =
        "Email and password are required.";

      return;
    }

    try {

      if (registerMode) {

        if (!name) {

          authError.textContent =
            "Please enter your name.";

          return;
        }

        const credential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        await updateProfile(
          credential.user,
          {
            displayName: name
          }
        );

        await createUserProfile(
          credential.user,
          name
        );

      } else {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );
      }

    } catch (error) {

      authError.textContent =
        friendlyError(error.code);

    }

  });


  function friendlyError(code) {

    switch (code) {

      case "auth/email-already-in-use":
        return "This email is already registered.";

      case "auth/invalid-email":
        return "Invalid email address.";

      case "auth/weak-password":
        return "Password must be at least 6 characters.";

      case "auth/invalid-credential":
        return "Invalid email or password.";

      default:
        return "Something went wrong. Please try again.";
    }

  }


  /* ================= USER PROFILE ================= */

  async function createUserProfile(user, name) {

    const userRef =
      ref(db, "users/" + user.uid);

    await set(userRef, {

      uid: user.uid,

      name: name,

      email: user.email,

      photo: "",

      online: true,

      lastSeen: Date.now(),

      createdAt: Date.now()

    });

  }


  /* ================= AUTH STATE ================= */

  onAuthStateChanged(auth, async user => {

    if (!user) {

      currentUser = null;

      authScreen.style.display =
        "flex";

      chatApp.style.display =
        "none";

      return;
    }

    currentUser = user;

    authScreen.style.display =
      "none";

    chatApp.style.display =
      "flex";

    await setOnlineStatus();

    loadUsers();

  });


  /* ================= ONLINE STATUS ================= */

  async function setOnlineStatus() {

    if (!currentUser) return;

    const statusRef =
      ref(
        db,
        "users/" + currentUser.uid
      );

    await update(statusRef, {

      online: true,

      lastSeen: Date.now()

    });

    const disconnectRef =
      onDisconnect(statusRef);

    await disconnectRef.update({

      online: false,

      lastSeen: Date.now()

    });

  }


  /* ================= USERS ================= */

  function loadUsers() {

    const usersRef =
      ref(db, "users");

    onValue(usersRef, snapshot => {

      usersCache = [];

      snapshot.forEach(child => {

        const user =
          child.val();

        if (
          user.uid !== currentUser.uid
        ) {

          usersCache.push(user);

        }

      });

      renderUsers(usersCache);

    });

  }


  function renderUsers(users) {

    userList.innerHTML = "";

    const search =
      searchInput.value
        .trim()
        .toLowerCase();

    const filtered =
      users.filter(user =>
        user.name
          ?.toLowerCase()
          .includes(search)
      );

    filtered.forEach(user => {

      const item =
        document.createElement("div");

      item.className =
        "user-item";

      const firstLetter =
        (user.name || "?")
          .charAt(0)
          .toUpperCase();

      item.innerHTML = `

        <div class="avatar">
          ${firstLetter}
        </div>

        <div class="user-info">

          <div class="user-name">
            ${escapeHtml(user.name || "User")}
          </div>

          <div class="user-status ${
            user.online ? "online" : ""
          }">

            ${
              user.online
              ? "● Online"
              : "Offline"
            }

          </div>

        </div>
      `;

      item.addEventListener(
        "click",
        () => openChat(user)
      );

      userList.appendChild(item);

    });

  }


  searchInput.addEventListener(
    "input",
    () => renderUsers(usersCache)
  );


  /* ================= CHAT ================= */

  async function openChat(user) {

    selectedUser = user;

    selectedConversation =
      createConversationId(
        currentUser.uid,
        user.uid
      );

    chatUserName.textContent =
      user.name || "User";

    chatAvatar.textContent =
      (user.name || "?")
        .charAt(0)
        .toUpperCase();

    chatUserStatus.textContent =
      user.online
      ? "● Online"
      : "Offline";

    chatUserStatus.className =
      "chat-user-status " +
      (user.online ? "online" : "");

    messages.innerHTML = "";

    chatApp.classList.add(
      "chat-open"
    );

    listenForMessages();

  }


  function createConversationId(uid1, uid2) {

    return [uid1, uid2]
      .sort()
      .join("_");

  }


  /* ================= MESSAGE LISTENER ================= */

  function listenForMessages() {

    if (!selectedConversation)
      return;

    const messagesRef =
      ref(
        db,
        "messages/" +
        selectedConversation
      );

    if (messageListener) {
      // Firebase listener is replaced by new onValue
    }

    onValue(
      messagesRef,
      snapshot => {

        messages.innerHTML = "";

        if (!snapshot.exists()) {

          messages.innerHTML = `
            <div class="empty">
              No messages yet.<br>
              Send a message to start chatting.
            </div>
          `;

          return;
        }

        snapshot.forEach(child => {

          const message =
            child.val();

          renderMessage(message);

        });

        messages.scrollTop =
          messages.scrollHeight;

      }
    );

  }


  function renderMessage(message) {

    const div =
      document.createElement("div");

    const mine =
      message.senderId ===
      currentUser.uid;

    div.className =
      "message " +
      (mine ? "me" : "other");

    const time =
      new Date(
        message.createdAt
      ).toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    div.innerHTML = `

      ${escapeHtml(message.text)}

      <span class="message-time">
        ${time}
        ${mine ? " ✓✓" : ""}
      </span>

    `;

    messages.appendChild(div);

  }


  /* ================= SEND MESSAGE ================= */

  messageForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      if (
        !currentUser ||
        !selectedUser ||
        !selectedConversation
      ) {
        return;
      }

      const text =
        messageInput.value.trim();

      if (!text) return;

      const messageRef =
        push(
          ref(
            db,
            "messages/" +
            selectedConversation
          )
        );

      await set(messageRef, {

        id: messageRef.key,

        senderId:
          currentUser.uid,

        receiverId:
          selectedUser.uid,

        text: text,

        type: "text",

        status: "sent",

        createdAt:
          Date.now()

      });

      messageInput.value = "";

    }
  );


  /* ================= LOGOUT ================= */

  logoutBtn.addEventListener(
    "click",
    async () => {

      if (currentUser) {

        await update(
          ref(
            db,
            "users/" +
            currentUser.uid
          ),
          {
            online: false,
            lastSeen: Date.now()
          }
        );

      }

      await signOut(auth);

    }
  );


  /* ================= MOBILE BACK ================= */

  backBtn.addEventListener(
    "click",
    () => {

      chatApp.classList.remove(
        "chat-open"
      );

      selectedUser = null;

    }
  );


  /* ================= HELPERS ================= */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
