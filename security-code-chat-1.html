<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f8faff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.lock-card{
  width:100%;
  max-width:390px;
  background:#fff;
  border-radius:24px;
  padding:34px 26px 28px;
  box-shadow:0 18px 50px rgba(31,50,81,.12);
  text-align:center;
}
.icon{
  width:72px;height:72px;margin:0 auto 20px;
  border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  background:#1877f2;color:#fff;font-size:32px;
  box-shadow:0 10px 24px rgba(24,119,242,.25);
}
h1{font-size:25px;color:#182230;margin-bottom:10px}
.subtitle{font-size:14px;color:#6b7280;line-height:1.6;margin-bottom:24px}
.code-input{
  width:100%;
  height:56px;
  border:1.5px solid #d8dee8;
  border-radius:14px;
  outline:none;
  text-align:center;
  font-size:24px;
  font-weight:700;
  letter-spacing:10px;
  color:#182230;
  transition:.2s;
}
.code-input:focus{border-color:#1877f2;box-shadow:0 0 0 4px rgba(24,119,242,.10)}
.enter-btn{
  width:100%;
  height:52px;
  margin-top:15px;
  border:0;
  border-radius:14px;
  background:#1877f2;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
.enter-btn:active{transform:scale(.99)}
.error{
  min-height:20px;
  margin-top:13px;
  color:#d93025;
  font-size:13px;
}
.success{
  display:none;
  margin-top:18px;
  color:#16a34a;
  font-size:14px;
  font-weight:700;
}
.chat-screen{
  display:none;
  width:100%;
  min-height:100vh;
  align-items:center;
  justify-content:center;
}
.chat-box{
  background:#fff;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,.1);
}
@media(max-width:480px){
  body{padding:14px}
  .lock-card{padding:30px 20px 25px;border-radius:20px}
}
</style>
</head>
<body>

<div id="lockScreen" class="lock-card">
  <div class="icon">🔐</div>

  <h1>Security Code</h1>

  <div class="subtitle">
    আপনার Security Codeটি দিন
  </div>

  <input
    id="codeInput"
    class="code-input"
    type="password"
    inputmode="numeric"
    maxlength="6"
    autocomplete="off"
    placeholder="••••••"
    aria-label="Security Code"
  >

  <button id="enterBtn" class="enter-btn">
    প্রবেশ করুন
  </button>

  <div id="error" class="error"></div>
  <div id="success" class="success">✓ যাচাই সফল হয়েছে</div>
</div>

<div id="chatScreen" class="chat-screen">
  <div class="chat-box">
    <h2>Chat</h2>
    <p style="margin-top:10px;color:#666;">আপনি সফলভাবে প্রবেশ করেছেন।</p>
  </div>
</div>

<script>
/*
  ==========================================
  SECURITY CODE
  ==========================================
  Demo code: 123456

  IMPORTANT:
  এই HTML-এ রাখা code client-side হওয়ায়
  production security-এর জন্য যথেষ্ট নয়।
  Production version-এ Firebase/backend দিয়ে
  code verify করা উচিত।
  ==========================================
*/

const SECURITY_CODE = "123456";

const lockScreen = document.getElementById("lockScreen");
const chatScreen = document.getElementById("chatScreen");
const codeInput = document.getElementById("codeInput");
const enterBtn = document.getElementById("enterBtn");
const error = document.getElementById("error");
const success = document.getElementById("success");

function verifyCode(){
  const code = codeInput.value.trim();

  error.textContent = "";
  success.style.display = "none";

  if(code.length !== 6){
    error.textContent = "অনুগ্রহ করে ৬ সংখ্যার Security Code দিন।";
    return;
  }

  if(code === SECURITY_CODE){
    success.style.display = "block";

    setTimeout(() => {
      lockScreen.style.display = "none";
      chatScreen.style.display = "flex";
    }, 350);

  }else{
    error.textContent = "Security Code সঠিক নয়। আবার চেষ্টা করুন।";
    codeInput.value = "";
    codeInput.focus();
  }
}

enterBtn.addEventListener("click", verifyCode);

codeInput.addEventListener("input", () => {
  codeInput.value = codeInput.value.replace(/\D/g,"").slice(0,6);
  error.textContent = "";
});

codeInput.addEventListener("keydown", (event) => {
  if(event.key === "Enter"){
    verifyCode();
  }
});

window.addEventListener("load", () => {
  codeInput.focus();
});
</script>

</body>
</html>
